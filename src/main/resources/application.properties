spring.application.name=event-management
server.port=${PORT:8080}

# MySQL Database Configuration (Environment variable overrides supported)
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/event_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:root}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:root2005}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,https://*.vercel.app,https://*.onrender.com}

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Default Admin Seed Configuration (Created securely if no admin exists)
app.admin.default-email=${DEFAULT_ADMIN_EMAIL:admin@eventmanagement.com}
app.admin.default-password=${DEFAULT_ADMIN_PASSWORD:Admin@123}
app.admin.default-name=${DEFAULT_ADMIN_NAME:System Administrator}
app.admin.default-phone=${DEFAULT_ADMIN_PHONE:9876543210}
